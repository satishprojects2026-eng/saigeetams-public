name: SaiGeetams
options:
  bundleIdPrefix: com.saigeetams
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  SaiGeetams:
    type: application
    platform: iOS
    sources:
      - SaiGeetams
      - path: supabase
        buildPhase: none
        type: folder
      - path: docs
        buildPhase: none
        type: folder
    info:
      path: SaiGeetams/Info.plist
      properties:
        CFBundleDisplayName: SAI GEETAMs
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsUsageDescription: SAI GEETAMs needs calendar access to sync your class schedule.
        NSCalendarsFullAccessUsageDescription: SAI GEETAMs needs calendar access to sync your class schedule.
        NSMicrophoneUsageDescription: SAI GEETAMs needs microphone access for voice recordings.
        NSCameraUsageDescription: SAI GEETAMs needs camera access for profile photos.
        NSPhotoLibraryUsageDescription: SAI GEETAMs needs photo library access for profile photos and assignments.
        NSFaceIDUsageDescription: Use Face ID for quick login.
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saigeetams.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98B7W2B79V
        CODE_SIGN_IDENTITY: "iPhone Developer"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: SaiGeetams/SaiGeetams.entitlements
      properties:
        com.apple.developer.associated-domains:
          - "applinks:saigeetams.com"
        aps-environment: development
